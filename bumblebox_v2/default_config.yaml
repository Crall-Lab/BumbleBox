system:
  colony_id: "01"
  data_root: "/mnt/bumblebox/data"
  pi_model: "auto"
  ram_gb_override: null
  timezone: "auto"
  # Refuse to record when the data drive is missing, so data is never written
  # to the system disk by mistake.
  #   auto:  a mounted drive is required if /etc/fstab lists one for data_root
  #          (or a folder above it), or if data_root is under /mnt or /media.
  #          Otherwise no drive is required.
  #   true:  data_root must be on a mounted drive, never the system disk.
  #   false: never check; recording to the system disk is allowed.
  require_mounted_storage: "auto"
  # Refuse to start a recording with less free space than this (GB). 0 disables.
  min_free_space_gb: 1.0

setup:
  completed: false
  hardware_profile: "custom"
  completed_at: null

local_index:
  enabled: true
  path: "LocalTrackingIndex"
  copy_tracking_csvs: true
  copy_run_summaries: true
  copy_optimization_results: true
  copy_config_snapshots: true
  copy_fps_reports: true

camera:
  profile: "custom"
  model: "auto"
  # Which Raspberry Pi camera this config records from, for a Pi with two
  # cameras. Leave these alone on a one-camera box. See docs/Two_Cameras.md.
  # camera_num: the camera's number (0 is the first camera).
  # camera_id: pins one physical camera by its libcamera Id. When set it
  #   decides, and a run is refused if that camera is not connected, instead
  #   of recording from the other one.
  # session_tag: added to session and file names (for example "cam2") so two
  #   cameras never produce files with the same name.
  camera_num: 0
  camera_id: null
  session_tag: ""
  width: 4056
  height: 3040
  fps_target: 5.0
  shutter_us: 2500
  codec: "mp4"
  infrared: true
  monochrome_output: false
  noise_reduction: "Auto"
  preview_window: "QT"
  tuning_file: null
  digital_zoom: null
  autofocus_mode: "default"
  lens_position: null
  focus_lock_after_warmup: false
  autofocus_range: "normal"
  autofocus_speed: "normal"
  autofocus_preflight_enabled: false
  autofocus_preflight_width: 1920
  autofocus_preflight_height: 1440
  autofocus_preflight_timeout_seconds: 8.0
  autofocus_preflight_stable_frames: 3
  mp4_codec: "libx264"
  # Encoder speed for libx264/libx265: ultrafast, superfast, veryfast, faster,
  # fast, medium, or slow. Faster presets encode more frames per second but
  # make larger files. "auto" uses "fast" for RAM recordings and "ultrafast"
  # for stream recordings. Run `bbx encode-benchmark` to see which presets keep
  # up with the camera on this machine.
  mp4_preset: "auto"

thermal:
  enabled: false
  device_path: "auto"
  width: 160
  height: 120
  fps_target: 8.7
  pixel_format: "auto"
  expected_name: "PureThermal"

realsense:
  enabled: false
  device_serial: "auto"
  depth_width: 848
  depth_height: 480
  color_width: 848
  color_height: 480
  fps: 30
  align_to: "none"
  warmup_frames: 15
  save_depth: true
  save_color: true

# Optional coordinated capture across two or more Raspberry Pis. The controller
# owns scheduling and the GUI; each node records only its assigned sensors.
distributed_capture:
  enabled: false
  role: "standalone"
  controller_node: "primary"
  start_lead_seconds: 8.0
  ready_timeout_seconds: 30.0
  maximum_clock_offset_ms: 5.0
  clock_samples: 5
  failure_policy: "all_or_nothing"
  transfer_after_capture: false
  require_same_revision: true
  nodes:
    - name: "primary"
      host: "localhost"
      local: true
      enabled: true
      sensors:
        - "rgb"
        - "thermal"
        - "realsense"
      user: null
      port: 22
      repo_path: null
      config_path: null

pipeline:
  mode: "record_and_track"
  tracking_source: "ram"
  defer_tracking_until_after_recording: true
  parallel_tracking: true
  calculate_behavior_metrics: true

capture:
  recording_seconds: 20
  record_interval_minutes: 30
  track_interval_minutes: 5
  composite_images_per_day: 1
  composite_image_sample_count: 60
  # Where frames go while a recording is being captured.
  #   ram:    keep every frame in memory and encode the video after capture
  #           ends. Fastest capture, but recording length is limited by RAM.
  #   stream: encode to disk while capturing. Memory use stays small, so
  #           recording length is limited only by disk space. Tracking then
  #           reads the saved video instead of frames in memory.
  frame_buffer: "ram"
  # Stream mode only: the most memory (MB) that frames waiting for the encoder
  # may occupy. If the encoder falls further behind than this, capture waits
  # for it and the run summary reports the stall.
  stream_queue_mb: 512

tracking:
  tag_dictionary: "4X4_50"
  box_preset: "custom"
  allowed_tag_ids: []
  allowed_tag_ids_path: null
  excluded_tag_ids:
    - 17
    - 37
  aruco_params:
    minMarkerPerimeterRate: 0.02
    adaptiveThreshWinSizeMin: 5
    adaptiveThreshWinSizeMax: 29
    adaptiveThreshWinSizeStep: 3
    polygonalApproxAccuracyRate: 0.06

cleaning:
  drop_unresolvable_duplicates: true
  remove_jumps: true
  jump_threshold_pixels: 500
  interpolate_data: true
  max_seconds_gap: 3
  compute_heading_angle: true

metrics:
  enabled:
    - speed
    - activity
    - distance_from_center
    - pairwise_distance
    - contacts
    - video_averages
  contact_distance_cm: 2.0
  pixel_contact_distance: 206.1
  moving_threshold_px_per_frame: 3.16

calibration:
  pixels_per_cm: 103.05
  method: "needs_calibration"
  last_updated: null
  multimodal_project_path: null

runtime:
  use_mock_camera: false
  camera_warmup_seconds: 2.0
  speed_cutoff_seconds: 4
  save_frame_timestamps: true
  fps_report_on_each_recording: true
  render_tracking_video: false
  save_mp4_sidecar_fps_txt: true
  ui_theme_mode: "dark"
  # Only one run can use the camera at a time. A run that finds the camera busy
  # waits this many seconds for the other run to finish capturing, then stops
  # with an error. 0 means do not wait.
  capture_lock_wait_seconds: 60

scheduling:
  backend: "systemd"
  scope: "user"
  unit_prefix: "bumblebox-v2"
  service_user: "auto"
  enabled: false
  active_hours: "00:00-23:59"
  # Longest a scheduled run may take (minutes) before systemd stops it, so one
  # hung run cannot block every later recording. "auto" allows the recording
  # time plus the larger of 30 minutes and two schedule intervals. Takes effect
  # when the timers are next written and installed.
  run_timeout_minutes: "auto"

fleet:
  role: "standalone"
  queen_host: null
  queen_local_pipeline_enabled: true
  queen_media_schedule:
    enabled: false
    pull_interval_minutes: 30
    track_interval_minutes: 60
    output_root: null
    max_videos_total: 200
    max_videos_per_worker: 1
    cooldown_minutes: 60
    max_queen_load_1m: 3.0
    min_queen_mem_gb: 0.8
    disable_visualization: false
    allow_when_queen_bbox_active: false
  ssh:
    user: "pi"
    port: 22
    identity_file: "~/.ssh/bbx_fleet_ed25519"
    connect_timeout_seconds: 5
  workers: []
